[package]
name = "sqlpool"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
# Two binaries: the app (`sqlpool`) and the MCP server (`sqlpool-mcp`). `tauri dev` runs the app.
default-run = "sqlpool"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sqlpool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = "0.7"
serde_yaml_ng = "0.10.0"
indexmap = { version = "2.14.2", features = ["serde"] }
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "time", "macros"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
tauri-plugin-dialog = "2.8.4"
keyring = { version = "3", features = ["apple-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
